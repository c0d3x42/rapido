[package]
name = "rapido-core"
version = "0.0.3"
edition = "2021"
license = "MIT"
description = "core libs"
publish = true
repository = "https://github.com/c0d3x42/rapido"


[dependencies]
async-std = { version = "1.13.1", features = ["attributes"] }
serde = {workspace = true}
serde_json = {workspace = true}
serde_with = {workspace = true}
sea-query = { workspace = true, features =["with-json"] }
sea-schema = { workspace = true, features=["with-serde", "sqlx-all"] }
sqlx = { workspace = true  }
tracing = { workspace = true }
thiserror = {workspace = true}
sea-orm = { version = "1.1.7", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-json",
  "debug-print"
] }
fjall = "2.7.2"
enum_dispatch = "0.3.13"
strum = { version = "0.27.1", features = ["derive"] }
strum_macros = "0.27.1"
